<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DSA Pattern Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #34d399;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: var(--border);
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .pattern-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pattern-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--success);
    }

    .confidence {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .socratic-list, .steps-list {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.5;
    }

    .socratic-list li {
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #7dd3fc;
    }

    .error-box {
      color: #f87171;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">DSA Pattern Finder</h1>
    <span id="tab-slug" class="status-badge">Detecting...</span>
  </div>

  <div id="result-container" style="display: none;">
    <div class="card">
      <div class="pattern-header">
        <span id="pattern-name" class="pattern-name">--</span>
        <span id="confidence" class="confidence">0%</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">💡 Socratic Interview Questions</div>
      <ol id="socratic-questions" class="socratic-list"></ol>
    </div>

    <div class="card">
      <div class="section-title">📝 Algorithmic Solution Steps</div>
      <ol id="thinking-steps" class="steps-list"></ol>
    </div>
  </div>

  <div id="loading" class="card" style="text-align: center; color: var(--text-muted);">
    Analyzing current problem...
  </div>

  <div id="error" class="error-box" style="display: none;"></div>

  <button id="analyze-btn" class="btn" style="margin-top: 10px;">Analyze Problem</button>

  <script type="module" src="popup.js"></script>
</body>
</html>
