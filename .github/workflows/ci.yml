name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Benchmark
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/src/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend/src

      - name: Run Unit & API Tests
        run: npm test
        working-directory: ./backend/src

      - name: Run Pattern Engine Benchmark Evaluation
        run: npm run evaluate
        working-directory: ./backend/src

  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/frontend-app/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend/frontend-app

      - name: Build Frontend App
        run: npm run build
        working-directory: ./frontend/frontend-app
